name: CI

# Static checks, plus the login flow patch against a real Home Assistant
# release. The acceptance test needs a running Home Assistant container and
# is still run by hand, see tests/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest ruff
      - run: ruff check custom_components tools tests
      - run: ruff format --check custom_components tools tests
      - run: pytest -v
      - run: python tools/check.py

  core:
    # The static checks cannot see a renamed core attribute - that is what
    # broke on 2026.11. This job installs core itself, so tests/test_ban.py
    # and tests/test_login_flow.py run instead of being skipped. It runs
    # both ends of the supported range, because the 2FA steps sit on
    # different classes in the two and the patch has to find them in both.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum hacs.json allows, and the release that moved the 2FA
        # steps from LoginFlow to MfaLoginFlow.
        core-version: ["2026.10.0", "2026.11.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Both 2026.10 and 2026.11 require 3.14.2 or newer.
          python-version: "3.14"
      - run: pip install pytest "homeassistant==${{ matrix.core-version }}"
      - run: pytest -v
