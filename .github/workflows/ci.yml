name: CI

# Static checks, plus the login flow patch against a real Home Assistant
# release. The acceptance test needs a running Home Assistant container and
# is still run by hand, see tests/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install pytest ruff
      - run: ruff check custom_components tools tests
      - run: ruff format --check custom_components tools tests
      - run: pytest -v
      - run: python tools/check.py

  core:
    # The static checks cannot see a renamed core attribute - that is what
    # broke on 2026.11. This job installs core itself, so tests/test_ban.py
    # and tests/test_login_flow.py run instead of being skipped. It runs
    # both ends of the supported range, because the 2FA steps sit on
    # different classes in the two and the patch has to find them in both.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum hacs.json allows, and the release that moved the 2FA
        # steps from LoginFlow to MfaLoginFlow.
        core-version: ["2026.10.0", "2026.11.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Both 2026.10 and 2026.11 require 3.14.2 or newer.
          python-version: "3.14"
      - run: pip install pytest "homeassistant==${{ matrix.core-version }}"
      - run: pytest -v

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, taken from the
      # release's own gitleaks_${GITLEAKS_VERSION}_checksums.txt. A version bump
      # without a matching hash bump fails the install step, which is the point:
      # the thing that scans for secrets should not be whatever the download
      # happened to hand us.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Scan every commit, not just the tip: history is what goes public.
          fetch-depth: 0

      - name: Restore the cached gitleaks binary
        id: cached-gitleaks
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/gitleaks
          key: gitleaks-${{ runner.os }}-x64-${{ env.GITLEAKS_VERSION }}

      # --retry covers the release CDN's transient 5xx; --max-time covers a
      # connection that is accepted and then stalls.
      - name: Install gitleaks
        if: steps.cached-gitleaks.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail

          curl -sSfL -o gitleaks.tar.gz \
            --connect-timeout 15 --max-time 180 \
            --retry 5 --retry-delay 3 --retry-max-time 180 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          if ! echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict -; then
            echo "::error::The gitleaks ${GITLEAKS_VERSION} download does not match" \
                 "GITLEAKS_SHA256. Either the pin is stale or the artifact is not" \
                 "the one we vetted -- do not re-run until you know which."
            exit 1
          fi

          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          rm gitleaks.tar.gz

      # Out of the worktree, so the scan never sees the scanner. --redact keeps
      # a finding's value out of the public job log.
      - name: Scan history
        run: |
          "${RUNNER_TEMP}/gitleaks" git --redact --verbose .
